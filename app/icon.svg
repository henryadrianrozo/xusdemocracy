<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="XUsDemocracy">
  <!-- Favicon. The courthouse from the search page's "every level of
       government" pitch icon, built as filled shapes rather than strokes
       because a 1.4-weight stroke disappears at 16px. Blue ground and red
       base band are the light-theme --blue and --red from app/globals.css;
       keep them in sync if the palette moves. Same ground on both themes,
       unlike the page, so the tab stays legible against a light and dark
       browser chrome alike. app/apple-icon.js renders the same mark by hand
       for the home-screen icon; keep the two in sync. -->
  <rect width="64" height="64" rx="14" fill="#0A84FF"/>
  <polygon points="32,12 50,26 14,26" fill="#ffffff"/>
  <rect x="16" y="30" width="6" height="20" fill="#ffffff"/>
  <rect x="29" y="30" width="6" height="20" fill="#ffffff"/>
  <rect x="42" y="30" width="6" height="20" fill="#ffffff"/>
  <rect x="12" y="50" width="40" height="4" fill="#ffffff"/>
  <rect x="10" y="56" width="44" height="6" fill="#FF3B30"/>
</svg>
